<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Traffic — Masuk</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-logo"><i data-lucide="traffic-cone"></i></span>
      <span>SMART <b>TRAFFIC</b></span>
    </div>
    <p class="muted">Informasi lalu lintas wilayah Yogyakarta</p>

    <div class="auth-tabs" role="tablist">
      <button data-mode="login" class="active">Masuk</button>
      <button data-mode="register">Daftar</button>
    </div>

    <form id="auth-form" novalidate>
      <label class="field" data-only="register" hidden>
        <span>Nama</span>
        <input name="name" autocomplete="name">
      </label>
      <label class="field">
        <span>Username</span>
        <input name="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="auth-error" class="auth-error" role="alert"></p>
      <button class="btn btn--primary" type="submit">Masuk</button>
    </form>

    <div id="demo-accounts" class="demo-accounts">
      <small>AKUN DEMO</small>
    </div>
    <p class="muted fine">Prototype: akun disimpan di browser (LocalStorage), bukan sistem login yang aman.</p>
  </main>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (() => {
      if (Auth.current()) return location.replace("index.html");
      const form = document.querySelector("#auth-form");
      const err = document.querySelector("#auth-error");
      let mode = "login";

      const setMode = m => {
        mode = m;
        document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("active", b.dataset.mode === m));
        form.querySelector("[data-only=register]").hidden = m !== "register";
        form.querySelector("[type=submit]").textContent = m === "login" ? "Masuk" : "Daftar sebagai Pengguna";
        form.password.autocomplete = m === "login" ? "current-password" : "new-password";
        err.textContent = "";
      };
      document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));

      form.addEventListener("submit", e => {
        e.preventDefault();
        const { username, password, name } = form;
        if (mode === "register") {
          const problem = Auth.register(username.value, password.value, name.value);
          if (problem) { err.textContent = problem; return; }
        }
        if (Auth.login(username.value, password.value)) location.replace("index.html");
        else err.textContent = "Username atau password salah.";
      });

      // Demo-account buttons are generated from Auth.DEMO_USERS and log in directly.
      const demo = document.querySelector("#demo-accounts");
      demo.insertAdjacentHTML("beforeend", Auth.DEMO_USERS.map((u, i) =>
        `<button class="btn" data-demo="${i}"><i data-lucide="${u.role === "admin" ? "shield-check" : "user"}"></i>` +
        `<span><b>${esc(u.name)}</b> ${esc(u.username)} / ${esc(u.password)}</span></button>`).join(""));
      demo.addEventListener("click", e => {
        const b = e.target.closest("[data-demo]");
        if (!b) return;
        const u = Auth.DEMO_USERS[b.dataset.demo];
        Auth.login(u.username, u.password);
        location.replace("index.html");
      });

      icons();
    })();
  </script>
</body>
</html>
